<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1Gambler Xmas Chess</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chessground/chessground.css">
  <style>
    .snowflake-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      pointer-events: none;
      opacity: 0.8;
      z-index: 10;
    }
  </style>
</head>
<body>

  <img src="assets/snowflake_knight.png" class="snowflake-overlay" alt="Snowflake Knight">
  <script src="chessground/chessground.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
